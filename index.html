<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 통역</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="통역">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --line: #2a2e38;
    --ko: #ffffff; --en: #9aa3b2; --accent: #4f8cff; --live: #ff4d5e; --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ko);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--live); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  header button { background: none; border: 0; color: var(--en); font-size: 15px; padding: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .item .ko { font-size: 24px; line-height: 1.4; font-weight: 600; word-break: keep-all; }
  .item .ko.wait { color: var(--muted); font-weight: 400; font-size: 18px; }
  .item .ko.err { color: var(--live); font-size: 16px; font-weight: 400; }
  .item .en { margin-top: 8px; font-size: 15px; line-height: 1.4; color: var(--en); }
  #interim { min-height: 52px; padding: 12px 16px; color: var(--en); font-size: 16px;
    border-top: 1px solid var(--line); font-style: italic; }
  #empty { color: var(--muted); text-align: center; margin: auto; font-size: 16px; line-height: 1.7; }
  footer { display: flex; gap: 10px; padding: 10px 16px 14px; }
  footer button { flex: 1; height: 56px; border-radius: 14px; border: 0; font-size: 18px;
    font-weight: 600; color: #fff; background: var(--accent); }
  footer button.stop { background: var(--live); }
  footer button.ghost { flex: 0 0 90px; background: var(--card); color: var(--en); }
  dialog { background: var(--card); color: var(--ko); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; width: min(92vw, 420px); margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-size: 18px; margin-bottom: 14px; }
  dialog label { display: block; font-size: 14px; color: var(--en); margin: 12px 0 6px; }
  dialog input, dialog select { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ko); padding: 0 12px; font-size: 16px; }
  dialog p { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  dialog .row { display: flex; gap: 10px; margin-top: 18px; }
  dialog .row button { flex: 1; height: 46px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 600; }
  #save { background: var(--accent); color: #fff; }
  #cancel { background: var(--line); color: var(--ko); }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1>영어 → 한국어 실시간 통역</h1>
  <button id="settingsBtn" aria-label="설정">설정</button>
</header>

<main id="log">
  <div id="empty">아래 <b>시작</b> 버튼을 누르고<br>상대방의 영어를 들려주세요.</div>
</main>
<div id="interim"></div>

<footer>
  <button id="clearBtn" class="ghost">지우기</button>
  <button id="toggleBtn">시작</button>
</footer>

<dialog id="settings">
  <h2>설정</h2>
  <label for="apiKey">Anthropic API 키</label>
  <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
  <p>키는 이 아이폰 안에만 저장되고, 번역 요청 때 Anthropic 서버로만 전송됩니다.</p>
  <label for="model">번역 모델</label>
  <select id="model">
    <option value="claude-opus-5-5">Claude Opus 5.5 (기본, 가장 정확)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (빠름)</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 (가장 빠르고 저렴)</option>
  </select>
  <div class="row">
    <button id="cancel">닫기</button>
    <button id="save">저장</button>
  </div>
</dialog>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm";

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const SYSTEM = `You are a live interpreter for a Korean business traveler in the US.
Translate the latest English utterance into natural, spoken Korean.
The text comes from speech recognition, so it may have missing punctuation or misheard words; infer the intended meaning from context.
Use the earlier utterances only as context. Output only the Korean translation of the latest utterance, with no notes, quotes, or romanization.`;

let recognition = null;
let running = false;
let wakeLock = null;
const history = []; // recent English utterances for context

// ---------- settings ----------
function openSettings() {
  $("apiKey").value = store.get("apiKey");
  $("model").value = store.get("model", "claude-opus-5-5");
  $("settings").showModal();
}
$("settingsBtn").onclick = openSettings;
$("cancel").onclick = () => $("settings").close();
$("save").onclick = () => {
  store.set("apiKey", $("apiKey").value.trim());
  store.set("model", $("model").value);
  $("settings").close();
};

// ---------- UI helpers ----------
function addItem(english) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="ko wait">번역 중…</div><div class="en"></div>`;
  el.querySelector(".en").textContent = english;
  $("log").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el.querySelector(".ko");
}
$("clearBtn").onclick = () => {
  $("log").innerHTML = "";
  history.length = 0;
};

// ---------- translation ----------
async function translate(english) {
  const koEl = addItem(english);
  const apiKey = store.get("apiKey");
  if (!apiKey) {
    koEl.className = "ko err";
    koEl.textContent = "설정에서 API 키를 먼저 입력하세요.";
    return;
  }
  const context = history.slice(-4);
  history.push(english);

  const prompt = (context.length ? `Earlier utterances:\n${context.map((t) => "- " + t).join("\n")}\n\n` : "")
    + `Latest utterance:\n${english}`;

  try {
    const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
    const model = store.get("model", "claude-opus-5-5");
    const params = {
      model,
      max_tokens: 2000,
      system: SYSTEM,
      output_config: { effort: "low" },
      messages: [{ role: "user", content: prompt }],
    };
    if (model !== "claude-haiku-5-5") {
      // Re-run on another model automatically if a safety classifier declines.
      params.betas = ["server-side-fallback-2026-07-01"];
      params.fallbacks = "default";
    }
    const stream = client.beta.messages.stream(params);
    let text = "";
    for await (const event of stream) {
      if (event.type === "content_block_delta" && event.delta.type === "text_delta") {
        text += event.delta.text;
        koEl.className = "ko";
        koEl.textContent = text;
      }
    }
    const final = await stream.finalMessage();
    if (final.stop_reason === "refusal") throw new Error("번역이 거절되었습니다.");
    if (!text) koEl.textContent = "(번역 결과 없음)";
  } catch (e) {
    koEl.className = "ko err";
    if (e instanceof Anthropic.AuthenticationError) koEl.textContent = "API 키가 올바르지 않습니다. 설정을 확인하세요.";
    else if (e instanceof Anthropic.RateLimitError) koEl.textContent = "요청이 너무 많습니다. 잠시 후 다시 시도하세요.";
    else if (e instanceof Anthropic.APIConnectionError) koEl.textContent = "인터넷 연결을 확인하세요.";
    else koEl.textContent = "번역 오류: " + (e.message || e);
  }
}

// ---------- speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setRunning(on) {
  running = on;
  $("dot").classList.toggle("on", on);
  $("toggleBtn").textContent = on ? "중지" : "시작";
  $("toggleBtn").classList.toggle("stop", on);
  if (!on) $("interim").textContent = "";
}

async function keepScreenOn(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

function start() {
  if (!SR) {
    alert("이 브라우저는 음성 인식을 지원하지 않습니다. 아이폰 Safari에서 열어주세요.");
    return;
  }
  if (!store.get("apiKey")) { openSettings(); return; }

  recognition = new SR();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const t = r[0].transcript.trim();
      if (r.isFinal) { if (t) translate(t); }
      else interim += t + " ";
    }
    $("interim").textContent = interim;
  };
  recognition.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      alert("마이크 또는 음성 인식 권한이 꺼져 있습니다.\n설정 > Safari > 마이크, 그리고 설정 > Siri에서 '받아쓰기'를 켜주세요.");
      stop();
    }
  };
  // iOS ends recognition after a pause; restart while the user wants it running.
  recognition.onend = () => {
    if (running) { try { recognition.start(); } catch {} }
  };

  try {
    recognition.start();
    setRunning(true);
    keepScreenOn(true);
  } catch (e) {
    alert("음성 인식을 시작할 수 없습니다: " + e.message);
  }
}

function stop() {
  setRunning(false);
  keepScreenOn(false);
  if (recognition) { recognition.onend = null; recognition.stop(); recognition = null; }
}

$("toggleBtn").onclick = () => (running ? stop() : start());
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running) keepScreenOn(true);
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!store.get("apiKey")) openSettings();
</script>
</body>
</html>
