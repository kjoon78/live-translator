<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 통역</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="통역">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --line: #2a2e38;
    --ko: #ffffff; --en: #9aa3b2; --accent: #4f8cff; --live: #ff4d5e; --muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ko);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--live); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  header button { background: none; border: 0; color: var(--en); font-size: 15px; padding: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .item .ko { font-size: 24px; line-height: 1.4; font-weight: 600; word-break: keep-all; }
  .item .ko.wait { color: var(--muted); font-weight: 400; font-size: 18px; }
  .item .ko.err { color: var(--live); font-size: 16px; font-weight: 400; }
  .item .en { margin-top: 8px; font-size: 15px; line-height: 1.4; color: var(--en); }
  .item.rev { border-left: 4px solid var(--accent); }
  .item.rev .ko { font-size: 28px; word-break: normal; }
  #interim { min-height: 52px; padding: 12px 16px; color: var(--en); font-size: 16px;
    border-top: 1px solid var(--line); font-style: italic; }
  #empty { color: var(--muted); text-align: center; margin: auto; font-size: 16px; line-height: 1.7; }
  footer { display: flex; gap: 10px; padding: 10px 16px 14px; }
  footer button { flex: 1; height: 56px; border-radius: 14px; border: 0; font-size: 18px;
    font-weight: 600; color: #fff; background: var(--accent); }
  footer button.stop { background: var(--live); }
  footer button.ghost { flex: 0 0 90px; background: var(--card); color: var(--en); }
  footer #revBtn { flex: 0 0 64px; font-size: 24px; color: var(--ko); }
  dialog { background: var(--card); color: var(--ko); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; width: min(92vw, 420px); margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-size: 18px; margin-bottom: 14px; }
  dialog label { display: block; font-size: 14px; color: var(--en); margin: 12px 0 6px; }
  dialog input, dialog select { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ko); padding: 0 12px; font-size: 16px; }
  dialog p { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  dialog .row { display: flex; gap: 10px; margin-top: 18px; }
  dialog .row button { flex: 1; height: 46px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 600; }
  #save { background: var(--accent); color: #fff; }
  #check { background: var(--line); color: var(--ko); }
  #keyStatus { min-height: 20px; font-size: 14px; margin-top: 10px; line-height: 1.5; word-break: break-all; }
  #keyStatus.ok { color: #34d399; } #keyStatus.bad { color: var(--live); }
  .show { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--en); margin-top: 8px; }
  .show input { width: auto; height: auto; }
  #cancel { background: var(--line); color: var(--ko); }
  #ver { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 4px; }
  #debug { display: none; max-height: 30vh; overflow-y: auto; margin: 0 16px 8px; padding: 8px 10px;
    background: #000; color: #8bd17c; font: 11px/1.45 ui-monospace, Menlo, monospace;
    border-radius: 8px; white-space: pre-wrap; word-break: break-all; }
  #debug.on { display: block; }
</style>
</head>
<body>
<header>
  <span id="dot" class="dot"></span>
  <h1 id="title">영어 → 한국어 실시간 통역</h1>
  <button id="ver" aria-label="진단 기록 보기"></button>
  <button id="settingsBtn" aria-label="설정">설정</button>
</header>

<main id="log">
  <div id="empty">아래 <b>시작</b> 버튼을 누르고<br><span id="emptyHint">상대방의 영어를</span> 들려주세요.<br><small>⇄ 버튼으로 통역 방향을 바꿀 수 있습니다.</small></div>
</main>
<div id="interim"></div>
<pre id="debug"></pre>

<footer>
  <button id="clearBtn" class="ghost">지우기</button>
  <button id="revBtn" class="ghost" aria-label="통역 방향 바꾸기">⇄</button>
  <button id="toggleBtn">시작</button>
</footer>

<dialog id="settings">
  <h2>설정</h2>
  <label for="apiKey">Anthropic API 키</label>
  <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-ant-api03-...">
  <label class="show"><input id="showKey" type="checkbox"> 키 보기</label>
  <div id="keyStatus"></div>
  <p>키는 이 아이폰 안에만 저장되고, 번역 요청 때 Anthropic 서버로만 전송됩니다.</p>
  <label for="model">번역 모델</label>
  <select id="model">
    <option value="claude-opus-5-5">Claude Opus 5.5 (기본, 가장 정확)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (빠름)</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5 (가장 빠르고 저렴)</option>
  </select>
  <div class="row">
    <button id="cancel">닫기</button>
    <button id="check">키 확인</button>
    <button id="save">저장</button>
  </div>
</dialog>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm";

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const SYSTEM = `You are a live interpreter in a conversation between a Korean business traveler ("Me", speaks Korean) and people in the US ("Them", speak English).
Translate the latest utterance into the requested language, in natural spoken style: polite, clear business English, or natural Korean.
The text comes from speech recognition, so it may have missing punctuation or misheard words; infer the intended meaning from context.
Use the earlier utterances only as context. Output only the translation of the latest utterance, with no notes, quotes, or romanization.`;

// Translation direction. The recognizer listens in one language per page load (see below),
// so switching direction reloads the page.
const DIRS = {
  "en-ko": { lang: "en-US", from: "English", to: "Korean", who: "Them",
             title: "영어 → 한국어 실시간 통역", hint: "상대방의 영어를" },
  "ko-en": { lang: "ko-KR", from: "Korean", to: "English", who: "Me",
             title: "한국어 → 영어 실시간 통역", hint: "내 한국어를" },
};
const dir = DIRS[store.get("dir", "en-ko")] ? store.get("dir", "en-ko") : "en-ko";
const D = DIRS[dir];
$("title").textContent = D.title;
if ($("emptyHint")) $("emptyHint").textContent = D.hint;
let pending = 0; // translations still streaming

const APP_VERSION = "v6";
const session = {
  get(k, d = "") { try { return sessionStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} },
};

// ---------- diagnostics (tap the version label to show) ----------
const debugLines = JSON.parse(session.get("debug", "[]"));
function dbg(msg) {
  const t = new Date().toTimeString().slice(0, 8);
  debugLines.push(`${t} ${msg}`);
  if (debugLines.length > 60) debugLines.shift();
  session.set("debug", JSON.stringify(debugLines));
  $("debug").textContent = debugLines.join("\n");
  $("debug").scrollTop = $("debug").scrollHeight;
}
$("ver").textContent = APP_VERSION;
$("ver").onclick = () => $("debug").classList.toggle("on");
$("debug").textContent = debugLines.join("\n");

let recognition = null;
let running = false;
let wakeLock = null;
const history = []; // recent English utterances for context

// ---------- settings ----------
function openSettings() {
  $("apiKey").value = store.get("apiKey");
  $("keyStatus").textContent = "";
  $("model").value = store.get("model", "claude-opus-5-5");
  $("settings").showModal();
}
$("settingsBtn").onclick = openSettings;
$("cancel").onclick = () => $("settings").close();
// Pasted keys often carry spaces, line breaks, invisible characters or "smart" dashes.
function cleanKey(raw) {
  return raw.replace(/[\s\u200B-\u200D\uFEFF]/g, "").replace(/[\u2010-\u2015\u2212]/g, "-");
}
$("showKey").onchange = (e) => { $("apiKey").type = e.target.checked ? "text" : "password"; };
$("check").onclick = async () => {
  const key = cleanKey($("apiKey").value);
  $("apiKey").value = key;
  const st = $("keyStatus");
  if (!key.startsWith("sk-ant-")) {
    st.className = "bad";
    st.textContent = `키는 "sk-ant-"로 시작해야 합니다. 지금 입력된 값은 "${key.slice(0, 10)}…" 입니다.`;
    return;
  }
  st.className = ""; st.textContent = "확인 중…";
  try {
    // Listing models costs nothing and only succeeds with a valid key.
    await new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true }).models.list({ limit: 1 });
    store.set("apiKey", key);
    st.className = "ok";
    st.textContent = "✓ 정상적인 키입니다. 저장했습니다.";
  } catch (e) {
    st.className = "bad";
    st.textContent = (e instanceof Anthropic.AuthenticationError)
      ? `Anthropic이 이 키를 거부했습니다 (길이 ${key.length}자, 끝 4자리 …${key.slice(-4)}). 콘솔에서 키가 삭제·비활성화되지 않았는지 확인하거나 새 키를 만들어 붙여넣으세요.`
      : "확인 실패: " + (e.message || e);
  }
};
$("save").onclick = () => {
  store.set("apiKey", cleanKey($("apiKey").value));
  store.set("model", $("model").value);
  $("settings").close();
};

// ---------- UI helpers ----------
function addItem(english) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = dir === "ko-en" ? "item rev" : "item";
  el.innerHTML = `<div class="ko wait">번역 중…</div><div class="en"></div>`;
  el.querySelector(".en").textContent = english;
  $("log").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el.querySelector(".ko");
}
function saveLog() {
  session.set("log", $("log").innerHTML);
  session.set("history", JSON.stringify(history.slice(-6)));
}
$("clearBtn").onclick = () => {
  $("log").innerHTML = "";
  history.length = 0;
  saveLog();
  dbg("clear");
};
if (session.get("log")) $("log").innerHTML = session.get("log");
history.push(...JSON.parse(session.get("history", "[]")));

// ---------- translation ----------
async function translate(english) {
  const koEl = addItem(english);
  const apiKey = store.get("apiKey");
  if (!apiKey) {
    koEl.className = "ko err";
    koEl.textContent = "설정에서 API 키를 먼저 입력하세요.";
    saveLog();
    return;
  }
  const context = history.slice(-6);
  history.push(`${D.who} (${D.from}): ${english}`);

  const prompt = (context.length ? `Earlier conversation:\n${context.map((t) => "- " + t).join("\n")}\n\n` : "")
    + `Translate this latest ${D.from} utterance into ${D.to}:\n${english}`;

  pending++;
  try {
    const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
    const model = store.get("model", "claude-opus-5-5");
    const params = {
      model,
      max_tokens: 2000,
      system: SYSTEM,
      output_config: { effort: "low" },
      messages: [{ role: "user", content: prompt }],
    };
    if (model !== "claude-haiku-5-5") {
      // Re-run on another model automatically if a safety classifier declines.
      params.betas = ["server-side-fallback-2026-07-01"];
      params.fallbacks = "default";
    }
    const stream = client.beta.messages.stream(params);
    let text = "";
    for await (const event of stream) {
      if (event.type === "content_block_delta" && event.delta.type === "text_delta") {
        text += event.delta.text;
        koEl.className = "ko";
        koEl.textContent = text;
      }
    }
    const final = await stream.finalMessage();
    if (final.stop_reason === "refusal") throw new Error("번역이 거절되었습니다.");
    if (!text) koEl.textContent = "(번역 결과 없음)";
  } catch (e) {
    koEl.className = "ko err";
    if (e instanceof Anthropic.AuthenticationError) koEl.textContent = "API 키가 올바르지 않습니다. 설정을 확인하세요.";
    else if (e instanceof Anthropic.BadRequestError && /credit balance/i.test(e.message)) koEl.textContent = "API 크레딧이 부족합니다. console.anthropic.com에서 충전하세요.";
    else if (e instanceof Anthropic.RateLimitError) koEl.textContent = "요청이 너무 많습니다. 잠시 후 다시 시도하세요.";
    else if (e instanceof Anthropic.APIConnectionError) koEl.textContent = "인터넷 연결을 확인하세요.";
    else koEl.textContent = "번역 오류: " + (e.message || e);
  }
  pending--;
  saveLog();
}

// ---------- speech recognition ----------
// iOS Safari bug: only the FIRST recognizer in a page load returns words. Later ones start and
// even report audio, but never deliver results. So this page uses exactly one recognizer:
// "중지" only pauses it (results are ignored), and whenever a fresh recognizer is needed the page
// reloads itself (keeping the transcript) and resumes.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const ALIVE_MS = 3000;   // how long a new recognizer may take to report audio
let recLive = false;     // the recognizer is running (between start() and onend)
let used = false;        // this page load already created its one recognizer
let autoStarted = false; // started by a resume after reload, without a tap
let watchdog = null;
let resultCount = 0;
let doneText = {};       // per result index: the text already translated (or discarded)
let lastInterim = [];    // [{i, text}] from the latest event, for the silence flush
let silenceTimer = null;

function setRunning(on) {
  running = on;
  $("dot").classList.toggle("on", on);
  $("toggleBtn").textContent = on ? "중지" : "시작";
  $("toggleBtn").classList.toggle("stop", on);
  if (!on) $("interim").textContent = "";
}

async function keepScreenOn(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

// Part of `text` not yet translated. iOS may grow one result in place (new words appended)
// or reuse the index for a new sentence; only strip the old text when it is a real prefix.
function untranslated(i, text) {
  const done = doneText[i] || "";
  const base = done.replace(/[.?!,\s]+$/, "").toLowerCase();
  return base && text.toLowerCase().startsWith(base) ? text.slice(base.length) : text;
}

function flush(i, text) {
  const fresh = untranslated(i, text).replace(/^[.?!,\s]+/, "").trim();
  doneText[i] = text;
  if (fresh) translate(fresh);
}

function flushInterim() {
  clearTimeout(silenceTimer);
  for (const { i, text } of lastInterim) flush(i, text);
  lastInterim = [];
  $("interim").textContent = "";
}

async function reloadAndResume(why) {
  dbg("reload: " + why);
  $("interim").textContent = "전환 중…";
  // Let translations that are still streaming finish so the reload does not cut them off.
  const until = Date.now() + 8000;
  while (pending > 0 && Date.now() < until) await new Promise((r) => setTimeout(r, 200));
  session.set("resume", "1");
  saveLog();
  location.reload();
}

function createRecognizer() {
  used = true;
  const rec = new SR();
  recognition = rec;
  rec.lang = D.lang;
  rec.continuous = true;
  rec.interimResults = true;

  rec.onstart = () => { dbg("onstart"); if (!("onaudiostart" in rec)) alive("start"); };
  rec.onaudiostart = () => alive("audio");
  rec.onspeechstart = () => dbg("speech detected");
  rec.onresult = (e) => {
    resultCount++;
    if (resultCount === 1) dbg("first result");
    if (!running) {
      // Paused: remember what was heard so it is never translated later.
      for (let i = e.resultIndex; i < e.results.length; i++) doneText[i] = e.results[i][0].transcript;
      lastInterim = [];
      return;
    }
    const shown = [];
    lastInterim = [];
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript;
      if (r.isFinal) { dbg(`final[${i}] ${text.slice(0, 40)}`); flush(i, text); }
      else {
        lastInterim.push({ i, text });
        shown.push(untranslated(i, text));
      }
    }
    $("interim").textContent = shown.join(" ").trim();
    clearTimeout(silenceTimer);
    if (lastInterim.length) silenceTimer = setTimeout(flushInterim, 1500);
  };
  rec.onerror = (e) => {
    dbg("error: " + e.error);
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      if (autoStarted) {
        // iOS refused to start without a tap after the reload; let the user tap 시작.
        used = false;
        setRunning(false);
        keepScreenOn(false);
        $("interim").textContent = "‘시작’을 눌러 계속하세요.";
        return;
      }
      alert("마이크 또는 음성 인식 권한이 꺼져 있습니다.\n설정 > Safari > 마이크, 그리고 설정 > 일반 > 키보드에서 '받아쓰기'를 켜주세요.");
      stop();
    }
  };
  rec.onend = () => {
    dbg(`onend (results: ${resultCount})`);
    recLive = false;
    clearTimeout(watchdog);
    if (running) {
      flushInterim();
      reloadAndResume("recognizer ended");
    }
  };

  watchdog = setTimeout(recover, ALIVE_MS);
  try {
    rec.start();
    recLive = true;
    dbg("start()");
  } catch (e) {
    dbg("start() failed: " + e.message);
    reloadAndResume("start failed");
  }
}

function alive(why) {
  if (watchdog) { clearTimeout(watchdog); watchdog = null; dbg("alive: " + why); }
  session.del("recovered"); // working again, so a later stall may reload once more
}

// The recognizer never came alive: iOS sometimes only recovers after a page reload.
function recover() {
  watchdog = null;
  if (!running) return;
  if (session.get("recovered")) {
    dbg("no audio again after reload; giving up");
    stop();
    $("interim").textContent = "음성 인식이 응답하지 않습니다. 앱을 완전히 닫았다가 다시 열어주세요.";
    return;
  }
  session.set("recovered", "1");
  reloadAndResume("no audio in 3s");
}

function start(auto = false) {
  if (!SR) {
    alert("이 브라우저는 음성 인식을 지원하지 않습니다. 아이폰 Safari에서 열어주세요.");
    return;
  }
  if (!store.get("apiKey")) { openSettings(); return; }
  autoStarted = auto;
  dbg(auto ? "auto start" : "tap start");
  if (recLive) {
    // Resume the paused recognizer: only words heard from now on are translated.
    setRunning(true);
    keepScreenOn(true);
    return;
  }
  if (used) { reloadAndResume("need a fresh recognizer"); return; }
  setRunning(true);
  keepScreenOn(true);
  createRecognizer();
}

function stop() {
  dbg("pause");
  flushInterim(); // translate the words heard right before 중지
  setRunning(false);
  keepScreenOn(false);
}

$("toggleBtn").onclick = () => (running ? stop() : start());
$("revBtn").onclick = () => {
  const next = dir === "en-ko" ? "ko-en" : "en-ko";
  dbg("reverse -> " + next);
  store.set("dir", next);
  if (running) flushInterim(); // translate what was said just before switching
  // Always reload: the recognizer's language is fixed for the page, and reusing it is unsafe.
  // The reload resumes listening right away in the new language.
  reloadAndResume("direction " + next);
};
// Release the microphone when the page goes away, so the reloaded page can take it cleanly.
window.addEventListener("pagehide", () => { try { recognition?.abort(); } catch {} });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && running) keepScreenOn(true);
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
dbg(`loaded ${APP_VERSION}`);
if (!store.get("apiKey")) openSettings();
else if (session.get("resume")) {
  // Coming back from a reload: try to continue without another tap.
  session.del("resume");
  start(true);
} else {
  session.del("recovered");
}
</script>
</body>
</html>
